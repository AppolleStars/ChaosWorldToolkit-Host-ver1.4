<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍管理 · 混乱世界</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../cloud/cloud-bridge.js"></script>
    <style>
        /* 背包模态框内表格样式 */
        .inventory-table {
            width: 100%;
            border-collapse: collapse;
        }
        .inventory-table th, .inventory-table td {
            padding: 8px;
            border-bottom: 1px solid #e2edf7;
            vertical-align: middle;
        }
        .inventory-table th {
            text-align: left;
            background: #f8fafd;
        }
        .qty-btn {
            background: #eef2fa;
            border: none;
            width: 28px;
            border-radius: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .qty-input {
            width: 60px;
            text-align: center;
            border: 1px solid #cbdbe0;
            border-radius: 1rem;
            padding: 4px;
        }
        .remove-item-btn {
            background: #fee2e2;
            border: none;
            border-radius: 1rem;
            padding: 4px 10px;
            cursor: pointer;
            color: #b1624b;
        }
        .view-detail-btn {
            background: none;
            border: none;
            color: #2c6e9e;
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: underline;
        }
        .inventory-actions {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .picker-item {
            padding: 8px;
            border-bottom: 1px solid #e2edf7;
            cursor: pointer;
        }
        .picker-item:hover {
            background: #eef2fa;
        }
        .team-inventory-btn {
            background: #eef2fa;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="docs-container team-container">
    <div class="top-bar">
        <button class="back-btn" id="backToHomeBtn">← 返回主界面</button>
        <div>
            <button class="import-btn" id="importTeamBtn">📂 导入队伍数据</button>
            <button class="create-btn" id="exportTeamBtn">📦 导出队伍数据</button>
            <button class="create-btn" id="addTeamBtn">+ 新建队伍</button>
        </div>
    </div>
    <h2>👥 队伍管理</h2>
    <div id="teamsContainer" class="team-list">
        <div class="empty-msg">暂无队伍，点击“新建队伍”开始创建你的冒险团队~</div>
    </div>
</div>

<!-- 背包模态框（队员背包 & 队伍背包共用） -->
<div id="inventoryModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 800px; max-height: 85vh;">
        <h3 id="inventoryModalTitle">🎒 背包</h3>
        <div id="inventoryModalBody"></div>
        <div class="modal-buttons">
            <button id="inventoryModalClose" class="btn-secondary">关闭</button>
        </div>
    </div>
</div>

<!-- 从图鉴选择物品的模态框 -->
<div id="itemPickerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
        <h3>📖 从图鉴添加物品</h3>
        <input type="text" id="pickerSearchInput" placeholder="🔍 搜索物品名称" style="width:100%; margin-bottom:1rem; padding:0.5rem; border-radius:1rem; border:1px solid #cbdbe0;">
        <div id="pickerItemsList" style="max-height: 400px; overflow-y: auto;"></div>
        <div class="modal-buttons">
            <button id="pickerCancelBtn" class="btn-secondary">取消</button>
        </div>
    </div>
</div>

<script src="team.js"></script>
</body>
</html>
