<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱 · 主控台</title>
    <link rel="stylesheet" href="style.css">
    <script src="cloud/cloud-bridge.js"></script>
</head>
<body>
<div class="dashboard-container">
    <header class="dashboard-header">
        <h1>📖 混乱世界 · 工具箱</h1>
        <p class="sub">选择功能，管理你的冒险历程</p>
    </header>
    <div class="button-grid" id="feature-grid">
        <button class="feature-card" id="btn-docs">
            <div class="icon">📜</div>
            <h2>聊天记录库</h2>
            <p>存储/编辑过往聊天记录</p>
        </button>
        <!-- 队伍管理按钮（替换命运骰子） -->
        <button class="feature-card" id="btn-team">
            <div class="icon">👥</div>
            <h2>队伍管理</h2>
            <p>管理冒险队伍与队员信息</p>
        </button>
        <button class="feature-card" id="btn-map">
            <div class="icon">🗺️</div>
            <h2>世界地图</h2>
            <p>查看混乱世界的地图</p>
        </button>
        <button class="feature-card" id="btn-encyclopedia">
            <div class="icon">📖</div>
            <h2>图鉴</h2>
            <p>查看物品、怪物等百科</p>
        </button>
        <button class="feature-card" id="btn-export-host">
            <div class="icon">📤</div>
            <h2>导出 JSON 给主持人</h2>
            <p>标准快照格式，本地下载后发给主持人汇总</p>
        </button>
        <button class="feature-card" id="btn-shared-view">
            <div class="icon">🌐</div>
            <h2>查看共享快照</h2>
            <p>阅读主持人发布在站点的最新公开数据（只读）</p>
        </button>
        <button class="feature-card" id="btn-shared-pull">
            <div class="icon">⬇️</div>
            <h2>合并共享到本机</h2>
            <p>把公开快照合并进当前浏览器本地存档</p>
        </button>
    </div>
    <footer class="dashboard-footer">
        <small>全AI生成 · 模块化管理 · 支持扩展</small>
        <small class="footer-extra" style="display:block;margin-top:0.5rem;opacity:0.85;">
            可选 Worker：<a href="cloud/upload.html">上传</a> · <a href="cloud/view.html">令牌查看</a> · <a href="cloud/pull.html">拉取</a>
        </small>
    </footer>
</div>
<script src="main.js"></script>
</body>
</html>
