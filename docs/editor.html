<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑冒险记录</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../cloud/cloud-bridge.js"></script>
    <style>
        .team-selector {
            margin-left: 1rem;
            font-size: 0.9rem;
        }
        .team-selector select {
            padding: 0.3rem 0.6rem;
            border-radius: 1rem;
            border: 1px solid #cbdbe0;
            background: white;
        }
        .sender-input-wrapper {
            position: relative;
        }
        datalist {
            display: none;
        }
        /* 行内编辑表单样式（独立于全局） */
        .edit-record-form {
            background: #f9fbfe;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #cbdde6;
            margin: 0.5rem 0;
        }
        .edit-record-form .form-group {
            margin-bottom: 0.8rem;
        }
        .edit-record-form input,
        .edit-record-form textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbdbe0;
            border-radius: 0.6rem;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .edit-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }
        .edit-actions button {
            background: #f0f4f9;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
        }
        .edit-actions .save-edit-btn {
            background: #2c6e9e;
            color: white;
        }
        .edit-actions .save-edit-btn:hover {
            background: #1e4a6e;
        }
        .edit-actions .cancel-edit-btn:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>
<div class="editor-container">
    <div class="editor-header">
        <div style="display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;">
            <input type="text" id="docNameInput" class="doc-title-input" placeholder="文档名称">
            <div class="team-selector">
                <label>📁 所属队伍：</label>
                <select id="teamSelect"></select>
            </div>
        </div>
        <div>
            <button class="back-btn" id="backToListBtn">← 返回文档库</button>
            <button class="save-doc-btn" id="saveDocBtn">💾 保存文档</button>
        </div>
    </div>

    <div class="add-record-card">
        <h3>✍️ 添加聊天记录</h3>
        <div class="form-group">
            <div class="sender-input-wrapper" style="flex:1">
                <input type="text" id="senderInput" placeholder="发言者" list="senderSuggestions" autocomplete="off">
                <datalist id="senderSuggestions"></datalist>
            </div>
            <textarea id="contentInput" rows="2" placeholder="信息内容 ..."></textarea>
        </div>
        <div class="form-group">
            <textarea id="feedbackInput" rows="2" placeholder="主持人如是说"></textarea>
        </div>
        <button class="add-btn" id="addRecordBtn">➕ 添加这条记录</button>
    </div>

    <div class="records-list">
        <h3>📜 冒险对话记录</h3>
        <div id="recordsContainer">
            <div class="empty-msg">暂无记录，使用上方表单添加你的第一段对话~</div>
        </div>
    </div>
</div>

<!-- 返回顶部按钮（样式来自全局 style.css） -->
<button class="scroll-to-top" id="scrollToTopBtn" title="返回顶部">↑</button>

<script src="editor.js"></script>
</body>
</html>
