# 快速配置：在 cloud/worker 目录运行 .\setup.ps1（需已安装 Node.js）
# 或阅读 ../SETUP.txt

name = "chaos-world-toolkit-snapshot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 创建 KV 后把 id / preview_id 替换为命令输出（勿留 REPLACE_ME）
[[kv_namespaces]]
binding = "SNAPSHOT"
id = "1d7e89eed6844af5b236e93eea2d6658"
preview_id = "00b2e8e65fa94271a54ebffa473b914d"

[vars]
ALLOWED_ORIGIN = "*"
# 与 teams_config.example.json / TEAMS_CONFIG.oneline.txt 一致；生产务必改为自有密钥：
