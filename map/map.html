<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界地图 · 混乱世界</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../cloud/cloud-bridge.js"></script>
</head>
<body>
<div class="docs-container" style="max-width: 1100px;">
    <div class="top-bar">
        <button class="back-btn" id="backToHome">← 返回主界面</button>
        <button class="back-btn" id="clearSelectionBtn">🔘 全不选</button>
    </div>
    <h2>🗺️ 混乱世界地图</h2>
    <div class="map-container" id="mapContainer" style="position: relative; text-align: center;">
        <img id="worldMapImage" src="../images/world_map.jpg" alt="世界地图" class="map-image"
             style="max-width:100%; border-radius:1rem; box-shadow:0 8px 20px rgba(0,0,0,0.15); cursor: crosshair;"
             onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22800%22%20height%3D%22600%22%20viewBox%3D%220%200%20800%20600%22%3E%3Crect%20width%3D%22800%22%20height%3D%22600%22%20fill%3D%22%23f0f0f0%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-size%3D%2220%22%20fill%3D%22%23999%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%3E地图图片未找到%3Cbr%2F%3E请将图片放在%20images%2Fworld_map.jpg%3C%2Ftext%3E%3C%2Fsvg%3E';">
    </div>

    <div style="margin-top: 2rem;">
        <h3>👥 队伍成员列表</h3>
        <p style="font-size:0.8rem; color:#5f7f9e;">点击队员选中（高亮），然后点击地图任意位置即可移动该队员。未选中的队员在地图上半透明显示。</p>
        <div id="teamListContainer" class="team-list" style="margin-top: 1rem;"></div>
    </div>
</div>
<script src="map.js"></script>
<script>
    // 返回主页按钮
    document.getElementById('backToHome')?.addEventListener('click', () => {
        window.location.href = '../index.html';
    });
</script>
</body>
</html>
