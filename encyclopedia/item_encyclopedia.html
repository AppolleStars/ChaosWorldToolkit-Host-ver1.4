<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品图鉴 · 混乱世界</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../cloud/cloud-bridge.js"></script>
</head>
<body>
<div class="docs-container" style="max-width: 1100px;">
    <div class="top-bar">
        <button class="back-btn" id="backToEncyBtn">← 返回图鉴主页</button>
        <div>
            <button class="import-btn" id="importItemsBtn">📂 导入物品JSON</button>
            <button class="create-btn" id="exportItemsBtn">📦 导出物品JSON</button>
            <button class="create-btn" id="addItemBtn">+ 新物品</button>
        </div>
    </div>
    <h2>⚗️ 物品图鉴</h2>
    <div class="item-search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 按物品名称搜索...">
        <button id="clearSearchBtn" class="back-btn" style="background:#f0f4f9;">✖️ 清除</button>
    </div>
    <div id="itemsGridContainer" class="item-grid">
        <div class="empty-ency">✨ 暂无物品，点击“新物品”开始记录奇珍异宝~</div>
    </div>
</div>

<!-- 物品编辑模态框 -->
<div id="itemModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 id="modalTitle">📝 物品信息</h3>
        <div class="form-field">
            <label>物品名称 *</label>
            <input type="text" id="itemNameInput" placeholder="例：精灵之泪">
        </div>
        <div class="form-field">
            <label>🏷️ 类别</label>
            <input type="text" id="itemCategoryInput" placeholder="例：药品、武器、书籍、材料">
        </div>
        <div class="form-field">
            <label>物品描述</label>
            <textarea id="itemDescInput" rows="2" placeholder="描述它的来历、外观或作用..."></textarea>
        </div>
        <div class="form-field">
            <label>📌 自定义文本项（可增删，支持多行）</label>
            <div id="extraFieldsContainer" class="dynamic-fields-list"></div>
            <button type="button" id="addExtraFieldBtn" class="btn-add-field">+ 新增文本项</button>
        </div>
        <div class="modal-buttons">
            <button id="modalCancelBtn" class="btn-secondary">取消</button>
            <button id="modalConfirmBtn" class="btn-primary">保存物品</button>
        </div>
    </div>
</div>

<script src="item_encyclopedia.js"></script>
</body>
</html>
